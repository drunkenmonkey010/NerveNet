services:
  postgres:
    image: postgres:16
    container_name: nervenet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nervenet}
      POSTGRES_USER: ${POSTGRES_USER:-nervenet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nervenet}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nervenet} -d ${POSTGRES_DB:-nervenet}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: